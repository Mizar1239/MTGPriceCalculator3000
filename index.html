<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Tufo Price Calculator 3000</title>
</head>
<style>
    body {
        background-color: black;
        color: white;
        padding: 5px 300px 5px 300px;
    }

    h3 {
        margin-bottom: 0;
    }

    .textblock {
        min-height: 400px;
        width: 100%;
        max-width: 600px;
        overflow-y: auto;
        font-size: large;
        resize: none;
        font-family: monospace;
        padding: 5px;
        box-sizing: border-box;
    }

    .container {
        display: flex;
        box-sizing: border-box;
    }

    .column {
        display: flex;
        flex-direction: column;
        width: 100%;
        box-sizing: border-box;
        flex: 1;
        padding: 10px 10px 10px 0px;
    }

    .buttons {
        display: flex;
        flex-direction: row;
        justify-content: flex-end;
    }

    .total_order {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
    }
    
    .total {
        display: flex;
        flex-direction: row;
        justify-content: flex-end;
        gap: 10px;
    }
    .totalRow {
        margin-top: 0px;
        margin-bottom: 0px;
    }

    .buttonsrev {
        text-align: right;
        width: 100%;
    }

    .btn {
        background-color: rgb(16, 219, 16);
        color: black;
        width: 100%;
        height: 50px;
        box-sizing: border-box;
    }
    .big-btn {
        width: 100%;
    }

    .notFoundArea {
        background-color: #ff7b00;
    }

    .hidden {
        display: none !important;
    }
</style>
<body>
    <div>
        <h1>MTG Deck Price Calculator</h1>
        <h3>Prezzi aggiornati al: 01/01/2026</h3>        
    </div>
    <div id="notFoundDiv" class="hidden">
        <div class="column">
            <p>Le seguenti carte non sono presenti nell'elenco:</p>
            <textarea name="notFoundArea" class="textblock notFoundArea" id="notFoundArea" rows="10" cols="40" placeholder="Lista dei prezzi..." readonly></textarea>
            <p>Correggi i nomi e ricalcola l'intera lista.</p>
        </div>
    </div>
    <div class="container">
        <div class="column">
            <div class="buttonsrev">
                <button class="btn big-btn" onclick="calculatePrice()">Calcola Prezzo</button>
            </div>
            <textarea name="decklist" class="textblock" id="decklist" placeholder="Incolla qui la tua decklist..."></textarea>
        </div>
        <div class="column">
            <div class="total_order">
                <div class="total">
                    <h2 class="totalRow">Carte: </h2>
                    <h2 class="totalRow" id="cardsNumber"> 0</h2>
                    <h2 class="totalRow"> - Totale: </h2>
                    <h2 class="totalRow" id="totalAmount"> 0.00€</h2>
                </div>
                <div class="buttons">
                    <button class="btn" onclick="sortForName()">Ordina per nome</button>
                    <button class="btn" onclick="sortForPrice()">Ordina per prezzo</button>
                </div>
            </div>
            <textarea name="pricelist" class="textblock" id="pricelist" placeholder="Lista dei prezzi..." readonly></textarea>       
        </div>
    </div>
</body>
<script>

    let cards = null;
    let pricedDecklist = [];

    async function loadData() {
        if (cards == null) {
            const res = await fetch('mtg_prices.json');
            cards = await res.json();
        }
        return cards;
    }

    window.onload = () => {
        loadData();
        document.getElementById('pricelist').value = ''
        document.getElementById('decklist').value = ''
        document.getElementById('notFoundArea').value = ''
    };

    function textAreaToList() {
        let text = document.getElementById('decklist').value;
        return text
            .split(/\r?\n/)
            .filter(s => s.length > 0)
            .map(line => {
                line = line.trimEnd();
                const match = line.match(/^(\d+)\s+(.*)$/);
                // console.log('after match: ', match);
                return match ? { quantity: Number(match[1]), name: match[2] } : { quantity: 1, name: line }
            });
    }

    function findPrice(name) {
        return cards.find((c) => c.name.toLowerCase() == name.toLowerCase()) ?? null;
    }

    function calculatePrice() {
        let priceNotFoundCards = []
        pricedDecklist = [];
        let totalPrice = 0;
        let cardsNumber = 0;

        let deckList = textAreaToList();
        // console.log(deckList);
        // console.log(cards);

        for (const deckEntry of deckList) {
            // console.log('deckEntry: ', deckEntry)
            let el = findPrice(deckEntry.name);

            if (el == null) {
                priceNotFoundCards.push(deckEntry.name);
                continue;
            }
            // console.log('cardName', el)
            pricedDecklist.push({
                name: deckEntry.name,
                quantity: deckEntry.quantity,
                price: el.price
            });
            totalPrice += deckEntry.quantity * el.price;
            cardsNumber += deckEntry.quantity;
        }

        // console.log('total price: ', totalPrice.toFixed(2));
        document.getElementById('totalAmount').innerHTML = `${totalPrice.toFixed(2)}€`;
        document.getElementById('cardsNumber').innerHTML = `${cardsNumber}`;
        // console.log('priced deck list: ', pricedDecklist)
        document.getElementById('pricelist').value = pricedDecklist.map(o => `${o.name} - ${o.quantity}x ${o.price.toFixed(2)}€`).join('\n');
        
        if (priceNotFoundCards.length > 0) {
            document.getElementById('notFoundDiv').classList.remove('hidden');
            document.getElementById('notFoundArea').value = priceNotFoundCards.join('\n');
        } else {
            document.getElementById('notFoundDiv').classList.add('hidden');
            document.getElementById('notFoundArea').value = '';
        }
    }

    function sortForPrice() {
        document.getElementById('pricelist').value = pricedDecklist.sort((a, b) => (a.price < b.price))
                                                        .map(o => `${o.name} - ${o.quantity}x ${o.price.toFixed(2)}€`).join('\n');
    }

    function sortForName() {
        document.getElementById('pricelist').value = pricedDecklist.sort((a, b) => ((a.name).localeCompare(b.name)))
                                                        .map(o => `${o.name} - ${o.quantity}x ${o.price.toFixed(2)}€`).join('\n');
    }
</script>
</html>
